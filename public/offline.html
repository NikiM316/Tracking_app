<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>Tracker</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.25rem;
        padding-top: env(safe-area-inset-top);
      }
      .wrap {
        max-width: 24rem;
        margin: 0 auto;
      }
      p.eyebrow {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #34d399;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.75rem;
        letter-spacing: -0.03em;
      }
      p.body {
        margin: 0.75rem 0 0;
        color: #a1a1aa;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 0.75rem;
        background: #10b981;
        color: #09090b;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <p class="eyebrow">Tracker</p>
        <h1>You're offline</h1>
        <p class="body">
          Reconnect to load your trackers. Pages you have already opened can
          still open from the home screen cache.
        </p>
        <a href="/">Try again</a>
      </div>
    </main>
  </body>
</html>
